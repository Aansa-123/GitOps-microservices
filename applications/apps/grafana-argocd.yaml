apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-argocd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:Aansa-123/GitOps-microservices.git
    targetRevision: dev
    path: monitoring/grafana

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true