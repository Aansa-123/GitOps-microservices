apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api

  template:
    metadata:
      labels:
        app: blog-api

    spec:
      containers:
        - name: blog-api
          image: aansa123/blog-service:dev-10
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: PORT

            - name: USER_API
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: USER_API

            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: KAFKA_BROKER

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: MONGO_URI