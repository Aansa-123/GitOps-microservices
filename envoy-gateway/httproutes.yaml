apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-route
  namespace: default
spec:
  parentRefs:
    - name: envoy-api-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /users

      backendRefs:
        - name: user-service
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog-route
  namespace: default
spec:
  parentRefs:
    - name: envoy-api-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/blog
      filters: 
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /blog
      backendRefs:
        - name: blog-service
          port: 3001
      timeouts:
        request: 10s
        backendRequest: 8s
      retries:
        attempts: 3
        perTryTimeout: 1s
        codes:
          - 500
          - 502
          - 503
          - 504
---
