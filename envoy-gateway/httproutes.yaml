apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-route
  namespace: default
spec:
  parentRefs:
    - name: envoy-api-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /users

      backendRefs:
        - name: user-service
          port: 3000
---
