apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana

  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    isDefault: true
    editable: false