apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: monitoring-grafana
  namespace: monitoring
  labels:
    dashboards: monitoring-grafana
spec:
  external:
    url: http://monitoring-grafana.monitoring.svc:80
    apiKey:
      name: grafana-operator-token
      key: service_account_token