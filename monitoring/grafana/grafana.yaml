apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: monitoring-grafana
  namespace: monitoring
  labels:
    dashboards: monitoring-grafana
spec:
  external:
    adminUser:
      name: grafana-admin-credentials
      key: admin-user
    adminPassword:
      name: grafana-admin-credentials
      key: admin-password
    tenantNamespace: default
    url: http://monitoring-grafana.monitoring.svc:80